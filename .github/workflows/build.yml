name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :androidApp:assembleRelease 2>&1 | tee android-build.log

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p apk
          cp androidApp/build/outputs/apk/release/androidApp-release.apk apk/syncmusic.apk
          echo "${{ github.run_number }}" > apk/syncmusic-apk.txt
          ls -la apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apk/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-android
          path: android-build.log
          retention-days: 7

  windows:
    name: Windows installer
    needs: android
    runs-on: windows-latest
    env:
      SYNCMUSIC_SKIP_ANDROID: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Bundle APK into the PC app
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: desktopApp/src/main/resources

      - name: Build MSI and portable app
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain :desktopApp:packageMsi :desktopApp:createDistributable 2>&1 | tee windows-build.log

      - name: Collect files
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem desktopApp/build/compose/binaries/main/msi/*.msi | Select-Object -First 1 | Copy-Item -Destination "dist/SyncMusic-$version.msi"
          Compress-Archive -Path desktopApp/build/compose/binaries/main/app/SyncMusic -DestinationPath "dist/SyncMusic-$version-portable.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/
          retention-days: 7

      - name: Launch the app, screenshots and startup timings
        continue-on-error: true
        shell: pwsh
        run: ./ci/windows_ui.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-windows-ui
          path: win-out/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-windows
          path: windows-build.log
          retention-days: 7

  release:
    name: Publish release
    needs: [android, windows, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="1.0.${{ github.run_number }}"
          cp apk/syncmusic.apk "dist/SyncMusic-$version.apk"
          cat > notes.md <<EOF
          **Встановлення**

          1. На комп'ютері: завантажте й запустіть \`SyncMusic-$version.msi\` (права адміністратора не потрібні).
             Якщо інсталятор не підходить — розпакуйте \`SyncMusic-$version-portable.zip\` і запустіть \`SyncMusic.exe\`.
          2. На телефоні: відскануйте камерою QR-код із вікна програми на ПК — завантажиться застосунок.
             Або завантажте \`SyncMusic-$version.apk\` звідси.
          3. У застосунку на телефоні натисніть «Знайти комп'ютер» і введіть код з екрана ПК.

          Коміт: ${{ github.sha }}
          EOF
          gh release create "v$version" dist/* \
            --repo "${{ github.repository }}" \
            --title "Sync Music $version" \
            --notes-file notes.md \
            --latest

  e2e:
    name: End-to-end test (PC app + Android emulator)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      SYNCMUSIC_SKIP_ANDROID: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Build the PC app (Linux)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p e2e-out
          cp apk/syncmusic.apk apk/syncmusic-apk.txt desktopApp/src/main/resources/
          ./gradlew --no-daemon --console=plain :desktopApp:createDistributable 2>&1 | tee e2e-out/e2e-build.log

      - name: Install Xvfb and ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick > /dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run end-to-end test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          disk-size: 6000M
          ram-size: 4096M
          emulator-boot-timeout: 1500
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: python3 ci/e2e_android.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-e2e
          path: e2e-out/
          retention-days: 7

  report:
    name: Publish build logs
    if: always()
    needs: [android, windows, e2e, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: log-*
          path: logs
          merge-multiple: true

      - name: Push logs to ci-logs branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          cp -r logs/. out/ 2>/dev/null || true
          cat > out/status.txt <<EOF
          run=${{ github.run_number }}
          sha=${{ github.sha }}
          android=${{ needs.android.result }}
          windows=${{ needs.windows.result }}
          e2e=${{ needs.e2e.result }}
          release=${{ needs.release.result }}
          EOF
          cd out
          git init -q -b ci-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Build logs for run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-logs
